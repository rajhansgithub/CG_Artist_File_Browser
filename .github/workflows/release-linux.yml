name: Build & Upload Linux Release (.deb & .AppImage)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach Linux binaries to (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name || inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf build-essential libfuse2 || sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf build-essential libfuse2t64

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build frontend
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri Linux Bundles
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npx tauri build --bundles deb,appimage

      - name: Upload Linux binaries to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          CLEAN_VER="${TAG#v}"
          echo "Uploading Linux binaries to release ${TAG}..."
          
          # Find and upload .deb packages
          find src-tauri/target/release/bundle/deb -type f -name "*.deb" -print0 | while IFS= read -r -d '' deb; do
            echo "Found deb: $deb"
            clean_deb="CG-Artist-File-Browser-v${CLEAN_VER}.deb"
            cp "$deb" "$clean_deb"
            gh release upload "$TAG" "$deb" "$clean_deb" --clobber
          done

          # Find and upload .AppImage packages
          find src-tauri/target/release/bundle/appimage -type f -name "*.AppImage" -print0 | while IFS= read -r -d '' appimage; do
            echo "Found AppImage: $appimage"
            clean_appimage="CG-Artist-File-Browser-v${CLEAN_VER}.AppImage"
            latest_appimage="CG-Artist-File-Browser.AppImage"
            cp "$appimage" "$clean_appimage"
            cp "$appimage" "$latest_appimage"
            gh release upload "$TAG" "$appimage" "$clean_appimage" "$latest_appimage" --clobber
          done

          echo "Listing release assets:"
          gh release view "$TAG"
