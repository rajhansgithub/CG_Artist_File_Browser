name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0-beta)'
        required: false
        default: 'v1.0.0-beta'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name || inputs.version }}
          releaseName: 'CG Artist File Browser ${{ github.ref_name || inputs.version }}'
          releaseBody: |
            ## CG Artist File Browser ${{ github.ref_name || inputs.version }}

            ### What's New in this Release:
            - **USD / USDA / USDC / USDZ 3D File Support**: Embedded background Blender conversion script directly into the native binary, eliminating missing script errors on all machines.
            - **Multi-layer EXR Beauty Thumbnails**: Multi-layer EXR and multi-pass AOV files now auto-detect and render their Beauty / Combined pass thumbnails in the file grid.
            - **3D Viewport Wireframe Fixed**: Completely overhauled wireframe rendering with full topology `WireframeGeometry`, dynamic `polygonOffset` on base materials to eliminate Z-fighting, and high-contrast cyan lines.
            - **Native Drag & Drop & Snapshot Export**: Fully functional native drag & drop and PNG snapshot saving across all viewports.
          releaseDraft: false
          prerelease: false

      - name: Upload Standalone Release Binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name || inputs.version }}"
          $exePath = "src-tauri/target/release/cg-artist-file-browser.exe"
          if (Test-Path $exePath) {
            $standaloneName = "CG-Artist-File-Browser-${tag}-Standalone.exe"
            Copy-Item $exePath $standaloneName
            gh release upload $tag $standaloneName --clobber
          }
