name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0-beta)'
        required: false
        default: 'v1.0.0-beta'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name || inputs.version }}
          releaseName: 'CG Artist File Browser ${{ github.ref_name || inputs.version }} (Installer & Portable)'
          releaseBody: |
            # CG Artist File Browser — ${{ github.ref_name || inputs.version }}

            ### 📦 Available Downloads

            1. 💻 **Windows Installer (.exe Setup)** — *Recommended for daily workflow*
               - 📥 **`CG-Artist-File-Browser-Setup-${{ github.ref_name || inputs.version }}.exe`** (~2.5 MB)
               - Features:
                 - Interactive NSIS setup wizard
                 - Custom installation directory selection
                 - Desktop and Start Menu shortcuts
                 - Clean Windows uninstaller

            2. 🧳 **Standalone Portable (.exe)** — *No installation required*
               - 📥 **`CG-Artist-File-Browser-${{ github.ref_name || inputs.version }}-Portable.exe`** (~10.3 MB)
               - 📥 **`CG-Artist-File-Browser-Portable.exe`** *(Latest permanent link)*
               - Double-click to run anywhere from USB drives, local folders, or network shares.

            ---

            ### ⚡ Rust & Tauri vs Electron Performance

            | Metric | Tauri | Legacy Electron | Improvement |
            | :--- | :--- | :--- | :--- |
            | **Installer Size** | **2.5 MB** | 115.5 MB | **97.8% smaller** |
            | **Portable Size** | **10.3 MB** | 115.3 MB | **91.1% smaller** |
            | **Cold Startup Time** | **< 0.3s** | ~3.5s | **10x faster** |
            | **Idle Memory (RAM)** | **~45 MB** | ~280 MB | **84% less RAM** |

            ---

            ### ✨ What's New in this Release:
            - **High-Poly Viewport Optimization**: Render-on-demand, cached shadow maps, and native WebGL wireframe shader handling 2M+ triangle meshes smoothly.
            - **USD / USDA / USDC / USDZ 3D File Support**: Embedded background Blender conversion script directly into the native binary, eliminating missing script errors on all machines.
            - **Multi-layer EXR Beauty Thumbnails**: Multi-layer EXR and multi-pass AOV files now auto-detect and render their Beauty / Combined pass thumbnails in the file grid.
            - **3D Viewport Wireframe Fixed**: Completely overhauled wireframe rendering with full topology `WireframeGeometry`, dynamic `polygonOffset` on base materials to eliminate Z-fighting, and high-contrast cyan lines.
            - **Native Drag & Drop & Snapshot Export**: Fully functional native drag & drop and PNG snapshot saving across all viewports.
          releaseDraft: false
          prerelease: false

      - name: Upload Clean Named Release Binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name || inputs.version }}"
          $exePath = "src-tauri/target/release/cg-artist-file-browser.exe"
          if (Test-Path $exePath) {
            $portableName = "CG-Artist-File-Browser-${tag}-Portable.exe"
            $latestPortable = "CG-Artist-File-Browser-Portable.exe"
            Copy-Item $exePath $portableName
            Copy-Item $exePath $latestPortable
            gh release upload $tag $portableName --clobber
            gh release upload $tag $latestPortable --clobber
          }

          $nsisPath = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($nsisPath) {
            $setupName = "CG-Artist-File-Browser-Setup-${tag}.exe"
            Copy-Item $nsisPath.FullName $setupName
            gh release upload $tag $setupName --clobber
          }
