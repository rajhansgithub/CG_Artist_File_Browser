[package]
name = "cg-artist-file-browser"
version = "1.0.0"
description = "High-Performance 3D & HDR/EXR File Browser for CG Artists"
authors = ["Antigravity"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
rayon = "1.10"
walkdir = "2.5"
sysinfo = "0.33"
md5 = "0.7"
hex = "0.4"
base64 = "0.22"
