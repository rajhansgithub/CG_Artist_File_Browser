[package]
name = "cg-artist-file-browser"
version = "1.10.1"
description = "High-Performance 3D & HDR/EXR File Browser for CG Artists"
authors = ["Antigravity"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
rayon = "1.10"
walkdir = "2.5"
sysinfo = "0.33"
md5 = "0.7"
base64 = "0.22"
exr = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "hdr", "tga", "tiff"] }
trash = "5"

# Native drag of real files out of the window (OLE drag source), Windows only
[target.'cfg(windows)'.dependencies]
drag = "2.1"
